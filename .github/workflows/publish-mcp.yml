name: Publish to MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false

      # Rejestr weryfikuje, że pakiet istnieje w PyPI — poczekaj, aż workflow
      # "Publish to PyPI" go wypchnie (albo uruchom ten workflow po nim).
      - name: Wait for the package on PyPI
        run: |
          for i in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/awesome-core/json" >/dev/null; then
              echo "PyPI: pakiet widoczny"; break
            fi
            echo "Czekam na PyPI... ($i/30)"; sleep 10
          done

      - name: Install mcp-publisher
        run: |
          # Pobranie z oficjalnego release GitHuba (modelcontextprotocol/registry).
          # Wersja przypięta przez "latest" — rozważ pin do konkretnego tagu
          # + weryfikację checksums.txt dla twardości supply-chain.
          curl -fL -o /tmp/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz"
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          chmod +x /tmp/mcp-publisher
          mv /tmp/mcp-publisher ./mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish