name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

# Jawne minimum na poziomie workflow (CodeQL: "Workflow does not contain
# permissions"). Bez tego GITHUB_TOKEN dostawalby domyslne uprawnienia orga.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      actions: read    # download-artifact@v4 czyta artefakty przez API
      id-token: write  # trusted publishing do PyPI (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
